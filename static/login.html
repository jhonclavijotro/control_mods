<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris Control - Iniciar Sesión</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css?v=9.1">
</head>
<body style="background: radial-gradient(circle at center, rgba(15, 23, 42, 0.98) 0%, rgba(2, 6, 23, 0.99) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; overflow-y: auto;">

    <div class="login-card" style="box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(16, 185, 129, 0.15);">
        <div class="login-header">
            <div class="login-logo-icon" style="background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);"><i class="fa-solid fa-sun-plant-wilt"></i></div>
            <h2 style="background: linear-gradient(90deg, #ffffff 0%, #a5f3fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SOLARIS CONTROL</h2>
            <p id="login-subheading">Ingreso al Sistema de Mantenimiento Solar</p>
        </div>

        <!-- Formulario de Login -->
        <form id="form-mandatory-login">
            <div id="login-error-msg" class="login-error-alert" style="display: none;"></div>
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-user"></i> Nombre de Usuario</label>
                <input type="text" id="login-username" class="form-control" required placeholder="ej: stakeholder" autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-lock"></i> Contraseña</label>
                <input type="password" id="login-password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-login-submit" id="btn-login-submit" style="background: linear-gradient(135deg, var(--primary) 0%, #059669 100%); box-shadow: 0 4px 15px var(--primary-glow);">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>
            <div class="login-toggle-link mt-3 text-center" style="margin-top: 1.25rem; text-align: center;">
                <small style="font-size: 0.85rem; color: var(--text-muted);">¿No tienes cuenta? <a href="#" id="link-show-register" style="color: var(--secondary); text-decoration: underline;">Registrarse como Stakeholder</a></small>
            </div>
        </form>

        <!-- Formulario de Registro de Stakeholder -->
        <form id="form-mandatory-register" style="display: none;">
            <div id="register-error-msg" class="login-error-alert" style="display: none;"></div>
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-id-card"></i> Nombre Completo</label>
                <input type="text" id="reg-fullname" class="form-control" required placeholder="ej: María Pérez">
            </div>
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-user"></i> Nombre de Usuario</label>
                <input type="text" id="reg-username" class="form-control" required placeholder="ej: mperez">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-lock"></i> Contraseña</label>
                <input type="password" id="reg-password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-success btn-block btn-login-submit" id="btn-register-submit" style="background: linear-gradient(135deg, var(--secondary) 0%, #0891b2 100%); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);">
                <i class="fa-solid fa-user-plus"></i> Crear Cuenta de Stakeholder
            </button>
            <div class="login-toggle-link mt-3 text-center" style="margin-top: 1.25rem; text-align: center;">
                <small style="font-size: 0.85rem; color: var(--text-muted);">¿Ya tienes cuenta? <a href="#" id="link-show-login" style="color: var(--secondary); text-decoration: underline;">Volver a Iniciar Sesión</a></small>
            </div>
        </form>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- JS Code -->
    <script src="/static/js/login.js?v=1.0"></script>
</body>
</html>
